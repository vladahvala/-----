events {}

http {
  # Вбудований DNS Docker. Імена сервісів перечитуються кожні 10 секунд,
  # тому nginx не треба перезапускати після перестворення контейнерів.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    absolute_redirect off;

    # внутрішня перевірка: чи користувач увійшов
    location = /_verify {
      internal;
      set $auth_host auth;
      proxy_pass http://$auth_host:8000/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # сторінка входу та вихід доступні без авторизації
    location ~ ^/auth/(login-page|login-form|logout)$ {
      set $auth_host auth;
      rewrite ^/auth/(.*)$ /$1 break;
      proxy_pass http://$auth_host:8000;
      proxy_set_header Host $host;
    }

    location @login {
      return 302 /auth/login-page;
    }

    # Prometheus тільки після входу
    location /prometheus/ {
      auth_request /_verify;
      error_page 401 = @login;

      set $prometheus_host prometheus;
      proxy_pass http://$prometheus_host:9090;
      proxy_set_header Host $host;
    }

    # все інше (Grafana) тільки після входу
    location / {
      auth_request /_verify;
      error_page 401 = @login;
      auth_request_set $auth_user $upstream_http_x_auth_user;

      set $grafana_host grafana;
      proxy_pass http://$grafana_host:3000;
      proxy_set_header Host $host;
      proxy_set_header X-WEBAUTH-USER $auth_user;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
