events {}

http {
  upstream auth_backend    { server auth:8000; }
  upstream grafana_backend { server grafana:3000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    absolute_redirect off;

    # внутрішня перевірка: чи користувач увійшов
    location = /_verify {
      internal;
      proxy_pass http://auth_backend/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # сторінка входу та вихід доступні без авторизації
    location ~ ^/auth/(login-page|login-form|logout)$ {
      rewrite ^/auth/(.*)$ /$1 break;
      proxy_pass http://auth_backend;
      proxy_set_header Host $host;
    }

    location @login {
      return 302 /auth/login-page;
    }

    # все інше (Grafana) тільки після перевірки
    location / {
      auth_request /_verify;
      error_page 401 = @login;
      auth_request_set $auth_user $upstream_http_x_auth_user;

      proxy_pass http://grafana_backend;
      proxy_set_header Host $host;
      proxy_set_header X-WEBAUTH-USER $auth_user;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}