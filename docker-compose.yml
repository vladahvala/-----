
name: university-monitoring

services:
  postgres:
    image: postgres:16
    container_name: university-postgres
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university_user
      POSTGRES_PASSWORD: university_pass
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university_user -d university_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: university-postgres-exporter
    environment:
      DATA_SOURCE_URI: "postgres:5432/university_db?sslmode=disable"
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD}"
    depends_on:
      - postgres
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: university-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=http://localhost:8080/prometheus/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: university-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_SERVER_ROOT_URL: "http://localhost:8080/"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Editor"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: university-nginx
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - grafana
      - auth
      - prometheus
    restart: unless-stopped

  auth:
    build: .
    container_name: university-auth
    command: uvicorn app.auth_server:app --host 0.0.0.0 --port 8000
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      - tempo
    volumes:
      - auth_data:/app/data
    restart: unless-stopped
  
  data-generator:
    build: .
    container_name: university-generator
    command: python -m app.data_generator
    environment:
      DB_HOST: postgres
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: university-loki
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
  
  alloy:
    image: grafana/alloy:latest
    container_name: university-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
  
  tempo:
    image: grafana/tempo:latest
    container_name: university-tempo
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  auth_data:
  prometheus_data:
